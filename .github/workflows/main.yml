name: Merge release into orphan new-main

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Nome da branch de release (ex: release/vX.Y.Z)'
        required: true

jobs:
  merge-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Buscar todas as branches remotas
        run: git fetch --all

      - name: Garantir que a branch release existe
        run: |
          RELEASE_BRANCH=${{ github.event.inputs.release_branch }}
          if ! git ls-remote --exit-code origin "$RELEASE_BRANCH" &>/dev/null; then
            echo "❌ Branch $RELEASE_BRANCH não existe no remoto."
            exit 1
          fi

      - name: Preparar branch new-main (órfã se não existir)
        run: |
          RELEASE_BRANCH=${{ github.event.inputs.release_branch }}

          if git ls-remote --exit-code origin new-main &>/dev/null; then
            echo "✅ Branch new-main existe. Fazendo checkout..."
            git checkout new-main
            git pull origin new-main
          else
            echo "🆕 Criando branch órfã new-main..."
            git checkout --orphan new-main
            git rm -rf . || true
            echo "# new-main (inicial órfã)" > README.md
            git add README.md
            git commit -m "Initial orphan branch new-main"
            git push -u origin new-main
          fi

      - name: Fazer merge squash da release
        run: |
          RELEASE_BRANCH=${{ github.event.inputs.release_branch }}
          echo "➡️ Fazendo merge squash de $RELEASE_BRANCH em new-main"
          git fetch origin $RELEASE_BRANCH:$RELEASE_BRANCH

          # Tenta fazer o merge squash
          set +e
          git merge --squash --allow-unrelated-histories $RELEASE_BRANCH
          MERGE_EXIT_CODE=$?
          set -e

          # Se não houver alterações, finaliza silenciosamente
          if [ $MERGE_EXIT_CODE -ne 0 ] && git diff --quiet; then
            echo "✅ Nenhuma nova alteração para mergear. Nada a fazer."
            exit 0
          fi

          # Commita o resultado
          if ! git diff --quiet; then
            git commit -m "Merge $RELEASE_BRANCH into new-main (squash)"
          else
            echo "⚠️ Nenhuma diferença detectada após o squash."
          fi

      - name: Enviar alterações para o remoto
        run: |
          echo "🚀 Enviando atualizações para o remoto"
          git push origin new-main
