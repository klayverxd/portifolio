name: Merge release branch into Bitbucket main (squash)

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Nome da branch de release no GitHub'
        required: true
        default: 'release'

jobs:
  merge-release:
    runs-on: ubuntu-latest

    env:
      BITBUCKET_REPO: git@bitbucket.org:klayver-ximenes/teste-action.git
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com

    steps:
      # ------------------------------------------------------------
      # Checkout the GitHub repository
      # ------------------------------------------------------------
      - name: Checkout release branch from GitHub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH for the Bitbucket remote
        env:
          SSH_PRIVATE_KEY: ${{ secrets.BITBUCKET_SSH_PRIVATE_KEY }}
        run: |
          # Create the .ssh folder & set proper permissions
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Add Bitbucket to known_hosts (prevents host‑verification prompt)
          ssh-keyscan bitbucket.org >> ~/.ssh/known_hosts

      # ------------------------------------------------------------
      # Clone the Bitbucket repo (main branch)
      # ------------------------------------------------------------
      - name: Clone Bitbucket repository
        run: |
          git clone --branch main "$BITBUCKET_REPO" bitbucket_repo
          cd bitbucket_repo
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

      # ------------------------------------------------------------
      # Copy contents from release (GitHub) to Bitbucket main
      # ------------------------------------------------------------
      - name: Copy release files into Bitbucket repo
        run: |
          TEMP_DIR=$(mktemp -d)

          # Copy GitHub code (release branch) to temp dir (clean copy)
          rsync -av --exclude='.git' ./ "$TEMP_DIR/"

          cd bitbucket_repo

          # Copy everything into Bitbucket repo (replace files)
          rsync -av --delete --exclude='.git' "$TEMP_DIR/" ./

          # Check if there are differences to commit
          if ! git diff --quiet; then
            git add -A
            COMMIT_MSG="Squash merge from '${{ github.event.inputs.release_branch }}' - $(date +'%Y-%m-%d %H:%M:%S')"
            git commit -m "$COMMIT_MSG"
            git push origin main
            echo "✅ Successfully merged release into Bitbucket main."
          else
            echo "✅ No changes to commit."
          fi

          rm -rf "$TEMP_DIR"
