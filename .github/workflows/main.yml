name: Merge release branch into Bitbucket main (squash)

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Name of the release branch on GitHub'
        required: true
        default: 'release'

jobs:
  merge-release:
    runs-on: ubuntu-latest

    env:
      BITBUCKET_REPO: git@bitbucket.org:klayver-ximenes/teste-action.git
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com

    steps:
      # ------------------------------------------------------------
      # 1️⃣ Checkout the release branch from GitHub
      # ------------------------------------------------------------
      - name: Checkout release branch from GitHub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.release_branch }}

      # ------------------------------------------------------------
      # 2️⃣ Set up SSH for Bitbucket
      # ------------------------------------------------------------
      - name: Set up SSH for Bitbucket
        env:
          SSH_PRIVATE_KEY: ${{ secrets.BITBUCKET_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan bitbucket.org >> ~/.ssh/known_hosts

      # ------------------------------------------------------------
      # 3️⃣ Clone the Bitbucket main branch
      # ------------------------------------------------------------
      - name: Clone Bitbucket repository
        run: |
          git clone --branch main "$BITBUCKET_REPO" bitbucket_repo

      # ------------------------------------------------------------
      # 4️⃣ Copy release files into Bitbucket repository
      # ------------------------------------------------------------
      - name: Merge release into Bitbucket main
        run: |
          # Create temporary directory for release files
          RELEASE_TEMP=$(mktemp -d)

          echo "✅ STEP 1"

          # Copy GitHub release files to temp directory
          rsync -av --exclude='.git' ./ "$RELEASE_TEMP/"

          echo "✅ STEP 2"

          # Enter the Bitbucket clone
          cd bitbucket_repo

          # Set Git identity
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"

          echo "✅ STEP 3"

          # Replace files in Bitbucket main with release content
          rsync -av --delete "$RELEASE_TEMP/" ./

          echo "✅ STEP 4"

          # Debug: show status and changed files
          git status
          git diff --name-only

          echo "✅ STEP 5"

          # Commit and push if there are changes
          git add -A

          echo "✅ STEP 6"
          if ! git diff --cached --quiet; then
            echo "✅ STEP 7"
            COMMIT_MSG="Squash merge from '${{ github.event.inputs.release_branch }}' - $(date +'%Y-%m-%d %H:%M:%S')"
            git commit -m "$COMMIT_MSG"
            echo "✅ STEP 8"
            git push origin main
            echo "✅ Successfully merged release into Bitbucket main."
          else
            echo "✅ No changes to commit."
          fi

          # Clean up temporary directory
          rm -rf "$RELEASE_TEMP"
