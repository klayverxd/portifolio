name: Merge release branch into Bitbucket main (squash)

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Name of the release branch on GitHub (release/vX.Y.Z)'
        required: true
        default: 'release/'
      commit_msg:
        description: 'Commit message'
        required: true

jobs:
  merge-release:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1️⃣ Checkout the release branch from GitHub
      # ------------------------------------------------------------
      - name: Checkout release branch from GitHub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.release_branch }}

      # ------------------------------------------------------------
      # 2️⃣ Set up SSH for Bitbucket
      # ------------------------------------------------------------
      - name: Set up SSH for Bitbucket
        env:
          SSH_PRIVATE_KEY: ${{ secrets.BITBUCKET_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan bitbucket.org >> ~/.ssh/known_hosts

      # ------------------------------------------------------------
      # 3️⃣ Copy release files into Bitbucket repository
      # ------------------------------------------------------------
      - name: Merge release into Bitbucket main
        run: |
          # Remove the files you don't want to push
          rm -rf ./aplicativo/logcsh.txt
          rm -rf ./aplicativo/mv_apk
          rm -rf ./aplicativo/push-foreground-ios.txt
          rm -rf ./aplicativo/ios-release.bundle
          rm -rf ./aplicativo/ios-release.bundle.map
          rm -rf ./aplicativo/android-release.bundle
          rm -rf ./aplicativo/android-release.bundle.map
          rm -rf ./aplicativo/android_build
          rm -rf ./aplicativo/generate-app-hash.sh
          rm -rf ./aplicativo/generate_app_hash_to_otp
          rm -rf ./aplicativo/patches
          rm -rf ./aplicativo/ios/BackgroundFetchManager.h
          rm -rf ./aplicativo/ios/BackgroundFetchManager.m
          rm -rf ./aplicativo/ios/Podfile.old
        
          # Create temporary directory for release files
          RELEASE_TEMP=$(mktemp -d)

          # Copy all files from the current GitHub release branch (excluding .git)
          rsync -av --exclude='.git' ./ "$RELEASE_TEMP/"

          # Clone Bitbucket main branch
          git clone --branch main git@bitbucket.org:klayver-ximenes/teste-action.git bitbucket_repo
          
          # Enter the Bitbucket clone
          cd bitbucket_repo

          # Configure Git identity for the commit
          git config user.name "Klayver-Action"
          git config user.email "klayverx@gmail.com"

          # Replace files in Bitbucket main with release content (preserving .git folder)
          rsync -av --delete --exclude='.git' "$RELEASE_TEMP/" ./

          # Stage all changes
          git add -A

          # Commit and push only if there are actual changes
          if ! git diff --cached --quiet; then
            COMMIT_MSG="'${{ github.event.inputs.commit_message }}' - $(date +'%Y-%m-%d %H:%M:%S')"
            git commit -m "$COMMIT_MSG"
            git push origin main
            echo "✅ Successfully merged release into Bitbucket main."
          else
            echo "✅ No changes to commit."
          fi

          # Clean up temporary directory
          rm -rf "$RELEASE_TEMP"
