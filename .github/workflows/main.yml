name: Merge release into new-main

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Nome da branch de release (ex: release/vX.Y.Z)'
        required: true

jobs:
  merge-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necessário para ter o histórico completo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Buscar todas as branches
        run: git fetch --all

      - name: Garantir que a branch new-main exista
        run: |
          if git show-ref --verify --quiet refs/heads/new-main; then
            echo "✅ Branch new-main já existe localmente."
            git checkout new-main
          elif git ls-remote --exit-code origin new-main; then
            echo "⬇️  Branch new-main existe no remoto, criando localmente..."
            git fetch origin new-main:new-main
            git checkout new-main
          else
            echo "🆕  Branch new-main não existe ainda. Criando nova branch."
            git checkout -b new-main
          fi


      - name: Atualizar new-main
        run: git pull origin new-main

      - name: Fazer merge squash da release
        run: |
          RELEASE_BRANCH=${{ github.event.inputs.release_branch }}
          echo "➡️ Fazendo merge squash de $RELEASE_BRANCH em new-main"
          git fetch origin $RELEASE_BRANCH:$RELEASE_BRANCH
          git merge --squash --allow-unrelated-histories $RELEASE_BRANCH
          git commit -m "Merge $RELEASE_BRANCH into new-main (squash)"

      - name: Enviar alterações para o remoto
        run: |
          git push origin new-main
